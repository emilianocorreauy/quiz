*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #292929;
  --bg-soft: #323232;
  --panel: #ffffff;
  --text: #ffffff;
  --text-soft: rgba(255,255,255,.82);
  --text-muted: rgba(255,255,255,.58);
  --ink: #111111;
  --gold: #b08a2e;
  --gold-soft: #d6b55b;
  --gold-dark: #8a6a1f;
  --gold-line: rgba(214,181,91,.34);
  --gold-line-strong: rgba(214,181,91,.58);
  --gold-glow: rgba(214,181,91,.18);
}

body {
  font-family: 'Bitter', serif;
  background:
    radial-gradient(circle at top center, rgba(214,181,91,.08) 0%, rgba(214,181,91,0) 36%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.page {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

header {
  padding: 48px 0 30px;
  border-bottom: 1px solid var(--gold-line-strong);
  margin-bottom: 40px;
}

.kicker {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-bottom: 20px;
}

header h1 {
  font-family: 'Bitter', serif;
  font-size: clamp(32px, 5.5vw, 52px);
  font-weight: 900;
  line-height: .98;
  color: var(--gold);
  text-wrap: balance;
}

header p {
  font-family: 'Bitter', serif;
  font-size: 17px;
  color: var(--text-soft);
  margin-top: 14px;
  line-height: 1.55;
  max-width: 58ch;
}

.progress {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-bottom: 20px;
}

.question-wrap {
  animation: fadeUp .35s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.question-text {
  font-family: 'Bitter', serif;
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 600;
  line-height: 1.2;
  margin-bottom: 28px;
}

.btn-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}

.choice-btn {
  width: 100%;
  padding: 17px 24px;
  border: 1.5px solid rgba(255,255,255,.18);
  border-radius: 40px;
  background: var(--panel);
  box-shadow: 0 0 0 0 rgba(214,181,91,0);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  line-height: 1.35;
}

.choice-btn:hover:not(:disabled) {
  border-color: var(--gold);
  transform: translateY(-1px);
  box-shadow: 0 0 0 4px var(--gold-glow);
}

.choice-btn.selected {
  background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  border-color: var(--gold);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 0 0 4px var(--gold-glow);
}

.movies-reveal {
  display: none;
  flex-direction: column;
  gap: 0;
  margin-top: 6px;
  animation: fadeUp .4s ease;
}

.movies-reveal.visible {
  display: flex;
}

.reveal-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-bottom: 12px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--gold-line);
}

.movie-card {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

.movie-icon {
  width: 72px;
  height: 72px;
  min-width: 72px;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  background: #1e1e1e;
}

.result-icon {
  width: 88px;
  height: 88px;
  min-width: 88px;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  background: #1e1e1e;
}

.movie-icon img,
.result-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.movie-title {
  font-family: 'Bitter', serif;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 3px;
}

.movie-dir {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.movie-desc {
  font-family: 'Bitter', serif;
  font-size: 13.5px;
  color: var(--text-soft);
  line-height: 1.5;
}

.watch-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
  padding: 9px 14px;
  border-radius: 999px;
  background: transparent;
  border: 1px solid var(--gold-line-strong);
  color: var(--gold-soft);
  text-decoration: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
}

.watch-btn:hover {
  background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  border-color: var(--gold);
  color: var(--ink);
  transform: translateY(-1px);
}

.watch-btn.is-disabled {
  opacity: .72;
  cursor: default;
  pointer-events: none;
}

.explanation {
  display: none;
  margin-top: 16px;
  font-family: 'Bitter', serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--text-soft);
  border-top: 1px solid var(--gold-line-strong);
  padding-top: 14px;
  animation: fadeUp .3s ease;
}

.explanation.visible {
  display: block;
}

.next-btn {
  display: none;
  margin-top: 30px;
  padding: 14px 36px;
  background: #171717;
  color: var(--gold-soft);
  border: 1px solid var(--gold-line-strong);
  border-radius: 40px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
}

.next-btn:hover {
  background: #1f1f1f;
  border-color: var(--gold-soft);
  transform: translateY(-1px);
}

.next-btn.visible {
  display: inline-block;
}

.result-wrap {
  display: none;
  animation: fadeUp .5s ease;
}

.result-wrap.visible {
  display: block;
}

.result-header {
  font-family: 'Bitter', serif;
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 14px;
}

.result-header em {
  color: var(--gold-soft);
  font-style: normal;
}

.result-sub {
  font-family: 'Bitter', serif;
  font-size: 17px;
  color: var(--text-soft);
  line-height: 1.6;
  margin-bottom: 32px;
}

.result-movie {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  padding: 20px 0;
  border-top: 1px solid var(--gold-line);
}

.result-title {
  font-family: 'Bitter', serif;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
}

.result-detail {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.result-pitch {
  font-family: 'Bitter', serif;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-soft);
}

.tag-match {
  display: inline-block;
  background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 999px;
  margin-bottom: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,.14);
}

.restart-btn {
  margin-top: 40px;
  padding: 14px 36px;
  background: transparent;
  color: var(--gold-soft);
  border: 1.5px solid var(--gold);
  border-radius: 40px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
}

.restart-btn:hover {
  background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold) 100%);
  color: var(--ink);
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(0,0,0,.18);
}

@media (max-width: 480px) {
  header {
    padding-top: 38px;
  }

  .movie-icon {
    width: 56px;
    height: 56px;
    min-width: 56px;
  }

  .result-icon {
    width: 70px;
    height: 70px;
    min-width: 70px;
  }

  .choice-btn {
    padding: 16px 18px;
    font-size: 14px;
  }
}
</style>
</head>

  },
  {
    q: "9. Hablemos de música: ¿banda sonora que te atraviesa o silencio que te pone tenso?",
    options: [
      {
        label: "Banda sonora letal",
        score: { sinners:3, f1:3, frankenstein:3, batalla:1, bugonia:1 },
        reveal: ["sinners","f1","frankenstein"],
        label2: "Para los que tiene buen oído",
        exp: "El blues del Delta en “Sinners”, el rugido de motores en “F1” y la partitura orquestal de Del Toro en “Frankestein” te van a conmover."
      },
      {
        label: "Silencio y atmósfera",
        score: { train:3, valor:3, hamnet:3, agente:3, bugonia:1 },
        reveal: ["train","valor","hamnet","agente"],
        label2: "Para integrase a la película totalmente",
        exp: "Cuatro películas que confían en la sutileza del sonido, que está ahí, pero casi nunca te dice cómo tenés que sentirte."
      }
    ]
  },
  {
    q: "10. Lo último: ¿algo corto e intenso o una experiencia larga?",
    options: [
      {
        label: "Corto, dos horas",
        score: { train:3, hamnet:3, valor:3, bugonia:3, agente:1 },
        reveal: ["train","hamnet","valor","bugonia"],
        label2: "Para disfrutar al instante ",
        exp: "Entran, hacen lo suyo y salen. Son las cuatro más cortas de la temporada. Y en ese tiempo les alcanza para dejar su huella."
      },
      {
        label: "Dos horas y media o más",
        score: { f1:3, batalla:3, sinners:3, frankenstein:3, agente:3, marty:3 },
        reveal: ["f1","batalla","sinners","frankenstein","agente","marty"],
        label2: "Para disfrutar cada detalle",
        exp: "Estás de suerte porque la mayoría de las películas de la temporada duran eso (o más). Se toman su tiempo, en la mayoría de los casos porque lo necesitan."
      }
    ]
  }
];

let current = 0;
let scores = {};
Object.keys(FILMS).forEach(k => scores[k] = 0);
let answered = false;

function getWatchButton(f) {
  if (!f.watchText) return '';

  const disabledClass = (!f.watchLink || f.watchLink === '#') ? ' is-disabled' : '';
  const href = f.watchLink && f.watchLink !== '#' ? f.watchLink : 'javascript:void(0)';

  return `
    <a class="watch-btn${disabledClass}" href="${href}" ${disabledClass ? 'aria-disabled="true"' : 'target="_blank" rel="noopener noreferrer"'}>
      ${f.watchText}
    </a>
  `;
}

function render() {
  if (current >= questions.length) {
    showResult();
    return;
  }

  answered = false;
  const q = questions[current];

  document.getElementById('quizArea').innerHTML = `
    <div class="question-wrap">
      <div class="progress">Pregunta ${current + 1} de ${questions.length}</div>
      <div class="question-text">${q.q}</div>

      <div class="btn-group">
        ${q.options.map((o, i) => `
          <button class="choice-btn" id="btn${i}" onclick="choose(${i})">${o.label}</button>
        `).join('')}
      </div>

      ${q.options.map((o, i) => `
        <div class="movies-reveal" id="rev${i}">
          <div class="reveal-label">${o.label2}</div>

          ${o.reveal.map(fk => {
            const f = FILMS[fk];
            return `
              <div class="movie-card">
                <div class="movie-icon" style="background:${f.bg};">
                  <img src="${f.img}" alt="${f.title}">
                </div>
                <div>
                  <div class="movie-title">${f.title}</div>
                  <div class="movie-dir">Dir. ${f.dir}</div>
                  <div class="movie-desc">${PITCHES[fk]}</div>
                  ${getWatchButton(f)}
                </div>
              </div>
            `;
          }).join('')}

          <div class="explanation" id="exp${i}">${o.exp}</div>
        </div>
      `).join('')}

      <button class="next-btn" id="nextBtn" onclick="next()">
        ${current < questions.length - 1 ? 'Siguiente →' : 'Ver mi resultado →'}
      </button>
    </div>
  `;
}

function choose(idx) {
  if (answered) return;

  answered = true;
  const q = questions[current];
  const chosen = q.options[idx];

  Object.entries(chosen.score).forEach(([k, v]) => {
    scores[k] = (scores[k] || 0) + v;
  });

  document.querySelectorAll('.choice-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === idx) {
      b.classList.add('selected');
    } else {
      b.style.opacity = '0.55';
    }
  });

  document.getElementById(`rev${idx}`).classList.add('visible');
  document.getElementById(`exp${idx}`).classList.add('visible');
  document.getElementById('nextBtn').classList.add('visible');
}

function next() {
  current++;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResult() {
  document.getElementById('quizArea').innerHTML = '';

  const top3 = Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([k]) => k);

  const wrap = document.getElementById('resultWrap');
  wrap.classList.add('visible');

  wrap.innerHTML = `
    <div class="progress">Tu resultado</div>
    <div class="result-header">Tu película es<br><em>${FILMS[top3[0]].title}</em></div>
    <p class="result-sub">Estas tres películas son las que más se alinean con tus respuestas.</p>

    <div>
      ${top3.map((fk, i) => {
        const f = FILMS[fk];
        return `
          <div class="result-movie">
            <div class="result-icon" style="background:${f.bg};">
              <img src="${f.img}" alt="${f.title}">
            </div>
            <div>
              ${i === 0 ? '<span class="tag-match">Tu match</span>' : ''}
              <div class="result-title">${f.title}</div>
              <div class="result-detail">Dir. ${f.dir}</div>
              <div class="result-pitch">${PITCHES[fk]}</div>
              ${getWatchButton(f)}
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <button class="restart-btn" onclick="restart()">Volver a empezar</button>
  `;
}

function restart() {
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('resultWrap').classList.remove('visible');
  document.getElementById('resultWrap').innerHTML = '';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
</html>
